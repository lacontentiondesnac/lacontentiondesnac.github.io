<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Contention Des NAC</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div id="commonNavbar"></div>

<main>
    <section class="hero-section">
        <div class="container py-5">
            <div class="row align-items-center min-vh-10 g-5">
                <div class="col-12">
                    <h1 class="display-2 fw-bold lh-1 mb-1">
                        La contention des NAC
                    </h1>
                </div>
            </div>
        </div>
    </section>

    <section class="py-5" id="nac-list">
        <div class="container py-lg-5">
            <div class="row justify-content-center text-center mb-5">
                <div class="col-lg-8">
                    <h2 class="display-5 fw-bold lh-1">
                        Cliquez sur un animal.
                    </h2>
                </div>
            </div>

            <div class="row g-4" id="nac-cards"></div>
        </div>
    </section>

    <section class="contact-section py-3 text-center text-white" id="contact">
        <div class="container py-lg-3">
            <h2 class="display-5 fw-bold mb-3">Contact</h2>
            <a href="mailto:lacontentiondesnac@gmail.com" class="btn btn-light rounded-pill px-4 fw-bold">
                Envoyer un message
            </a>
        </div>
    </section>
</main>

<div id="commonFooter"></div>

<template id="nac-card-template">
    <!--    <div class="col-md-6 col-lg-4 col-xl-3">-->
    <div class="col-md-6 col-lg-4">
        <article class="card nac-card h-100 border-0">
            <a class="image-button">
                <img class="card-img-top">
                <span></span>
            </a>

            <div class="card-body p-4 d-flex flex-column">
                <h3 class="h4 card-title brand-color"></h3>
                <p class="card-text flex-grow-1"></p>
                <a class="btn btn-primary-custom rounded-pill align-self-start">
                    Plus d'infos
                </a>
            </div>
        </article>
    </div>
</template>


<script src="js/animals.js"></script>
<script src="js/layout.js"></script>
<script src="js/navAnimals.js"></script>
<script src="js/indexCards.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
